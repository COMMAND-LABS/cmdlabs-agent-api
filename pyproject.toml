[project]
name = "kalygo3-completion-api"
version = "0.1.0"
description = "Kalygo3 Completion API - streaming LLM completion microservice"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "fastapi>=0.112.0,<1.0",
    "uvicorn==0.30.5",
    "python-dotenv==1.0.1",
    "pydantic>=2.9.0",
    "slowapi>=0.1.9,<0.2.0",
    "python-jose>=3.3.0,<4.0",
    "passlib>=1.7.4,<2.0",
    "python-multipart>=0.0.9,<1.0",
    "SQLAlchemy>=2.0.31,<3.0",
    "psycopg2-binary>=2.9.9,<3.0",
    "langchain>=1.0.0",
    "langchain-anthropic>=0.3.19",
    "langchain-classic>=1.0.0",
    "langchain-community>=0.3.31",
    "langchain-core>=1.0.0",
    "langchain-openai>=1.0.0",
    "langsmith>=0.1.0",
    "openai>=1.109.1",
    "cryptography",
    "jsonschema>=4.20.0,<5.0",
    "pypdf>=4.3.1,<5.0",
    "pymupdf>=1.24.0,<2.0",
    "pillow>=10.4.0,<11.0",
    "aiohttp>=3.9.0",
    "replicate>=0.31.0,<1.0",
    "pinecone>=7.3.0,<8.0",
    "starlette<0.38.0,>=0.37.2",
    "httpx==0.28.0",
    "boto3>=1.35.0,<2.0",
    "pytest>=8.0.0",
    "setuptools>=65.0.0",
    "langchain-google-genai>=3.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
